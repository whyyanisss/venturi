name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Tests
        run: npm test
      - name: Construire le .vsix
        run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: venturi-vsix
          path: "*.vsix"
