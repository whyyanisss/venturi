name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances de test (jsdom)
        run: npm ci
      - name: Installer Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Tests
        run: npm test
      - name: Construire le .vsix et le zip des sources
        run: |
          npm run package
          V=$(node -p "require('./package.json').version")
          git archive --format=zip --prefix=venturi/ HEAD -o "venturi-$V-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: venturi
          path: |
            *.vsix
            *-source.zip
